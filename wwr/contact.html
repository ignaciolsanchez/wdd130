<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - White Water Rafting</title>
    <meta name="description"
      content="Contact Us site - White Water Rafting - We provide you with our social media and company information.">
    <meta name="author" content="Ignacio Leonel Sanchez">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-sight.png" alt="Rafting Site Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="company-data">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>

        </div>

        <section class="location">
            <img src="images/wwr-location.jpg" alt="White water rafting location in map">
            <div class="map-google">
                <iframe class="custom-google-map" src="https://google.com?..." width="600"
                  height="450" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </section>


        <section class="data-entry">
            <form class="contact-form">

                <table class="form-table">
                    <tr>
                        <td class="label-column"><label for="name">Name</label></td>
                        <td class="input-column"><input type="text" id="name"
                              placeholder="Full name"></td>
                    </tr>

                    <tr>
                        <td class="label-column"><label for="email">Email</label></td>
                        <td class="input-colun"><input type="email" id="email"
                              placeholder="Email address"></td>
                    </tr>

                    <tr>
                        <td class="label-column"><label>Message Purpose</label></td>
                        <td class="input-column">
                            <div class="radio-group">
                                <label><input type="radio" name="purpose" value="general">
                                    General
                                    Inquiry</label>
                                <label><input type="radio" name="purpose" value="reservation">
                                    Reservation
                                    Question</label>
                                <label><input type="radio" name="purpose" value="suggestion">
                                    Website
                                    Suggestion</label>
                            </div>
                        </td>
                    </tr>
                </table>

                <div class="textarea-group">
                    <label for="message">Message</label>
                    <textarea id="message" placeholder="Type here"></textarea>
                </div>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox">
                        Please Subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>

            </form>
        </section>
        <section class="galeria-adventure-grid">
            <h3>We Are Here to Serve You</h3>
            <figure class="landscape-photo">
                <img src="images/employee-profile-two.jpg" alt="Employee Profile girl Liz">
                <figcaption>Lizeth Belen</figcaption>
            </figure>

            <figure class="landscape-photo">
                <img src="images/employee-profile-one.jpg" alt="Employee Profile boy Igna">
                <figcaption>Ignacio Sanchez</figcaption>
            </figure>

            <figure class="landscape-photo">
                <img src="images/employee-profile-three.jpg" alt="Employee Profile girl Xime">
                <figcaption>Ximena Evelyn</figcaption>
            </figure>
        </section>

    </main>


    <footer>
        <div class="footer-bottom">
            <p>Copyright &copy; 2026 | White Water Rafting | Ignacio Sanchez &#10070;</p>
            <nav class="socialmedia">
                <a href="https://Youtube.com"><img src="images/icon-youtube.png"
                      alt="Youtube Icon"></a>
                <a href="https://facebook.com"><img src="images/icon-facebook.png"
                      alt="Facebook Icon"></a>
                <a href="https://WhatsApp.com"><img src="images/icon-whatsapp.png"
                      alt="WhatsApp Icon"></a>
            </nav>
        </div>
    </footer>

</body>

</html>
