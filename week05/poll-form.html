<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML FORM - User Poll Activity</title>
    <meta name="description" content="This page is a prototype page of a HTML Form">
    <meta name="author" content="Ignacio Sanchez">
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
    </header>


    <main>
        <h1>WDD 130 | HTML FORM - User Poll</h1>


        <form action="">
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item column2">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="form-item column2">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
            </fieldset>


            <fieldset>
                <legend>Questions</legend>
                <div class="form-item column1 nextto">
                    <label for="browser">What is your favorite browser?</label>
                    <select name="browser" id="browser">
                        <option value="5">Chrome</option>
                        <option value="4">Safari</option>
                        <option value="3">Edge</option>
                        <option value="2">Brave</option>
                        <option value="1">Other</option>
                    </select>
                </div>

                <div class="form-item column1 nextto">
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>

                <div class="form-item column1">
                    <label for="feedback">List the places you have lived</label>
                    <textarea name="feedback" id="feedback"
                      placeholder="Orlando Florida, Las Vegas Nevada, San Francisco California"
                      rows="4"></textarea>
                </div>
            </fieldset>
            <div class="button">
                <button type="submit">Submit Poll</button>
            </div>


        </form>
    </main>


    <footer>
        <p>Copyright &copy; 2026 | HTML FORM - User Poll Activity | Ignacio Sanchez &#10070;</p>
    </footer>
</body>

</html>
